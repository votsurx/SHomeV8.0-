name: Build & Publish Release to Public Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ═══════════════════════════════════════════════════════════
      # 🧹 ОСВОБОЖДАЕМ МЕСТО на runner (обычно ~30 GB свободного)
      # ═══════════════════════════════════════════════════════════
      - name: Free disk space
        run: |
          echo "=== Размер до очистки ==="
          df -h
          
          # Удаляем тяжёлые SDK, которые не нужны для Android-сборки
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          
          # Очищаем apt cache
          sudo apt-get clean
          
          echo "=== Размер после очистки ==="
          df -h

      # ═══════════════════════════════════════════════════════════
      # 📥 Checkout
      # ═══════════════════════════════════════════════════════════
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/shome-key.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../app/shome-key.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      # ═══════════════════════════════════════════════════════════════
      # 📄 Извлекаем секцию CHANGELOG.md для текущей версии
      # ═══════════════════════════════════════════════════════════════
      - name: Read CHANGELOG section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          
          echo "🔍 Ищем секцию для v$VERSION в CHANGELOG.md"
          
          # Извлекаем строки от "## vVERSION" до следующего "## v"
          awk -v ver="## v$VERSION" '
            $0 ~ ver {flag=1; next}
            /^## v/ {flag=0}
            flag
          ' CHANGELOG.md > /tmp/changelog_section.txt
          
          if [ ! -s /tmp/changelog_section.txt ]; then
            echo "⚠️ Секция v$VERSION не найдена в CHANGELOG.md"
            echo "📦 Fallback: берём коммиты с прошлого тега"
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1)
            if [ -n "$PREV_TAG" ]; then
              git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges > /tmp/changelog_section.txt
            else
              git log --pretty=format:"- %s" --no-merges -10 > /tmp/changelog_section.txt
            fi
          else
            echo "✅ Секция найдена в CHANGELOG.md"
          fi
          
          echo "📝 Содержимое:"
          cat /tmp/changelog_section.txt
          
          # Экранируем для GITHUB_OUTPUT
          echo "section<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog_section.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════
      # 🚀 Публикуем релиз в публичном репо
      # ═══════════════════════════════════════════════════════════════
      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: votsurx/SHome-Releases
          tag_name: ${{ github.ref_name }}
          name: SHome ${{ github.ref_name }}
          body: |
            ## 🏠 SHome ${{ github.ref_name }}

            ${{ steps.changelog.outputs.section }}

            ---

            ### 📦 Установка
            Скачайте APK для вашего устройства:
            - **arm64-v8a** — большинство современных телефонов
            - **armeabi-v7a** — старые устройства (Android 7-9)
            - **x86_64** — эмуляторы и планшеты Intel

            ### 🔄 Обновление
            Откройте SHome → Настройки → «Проверить обновления»

            ---

            © votsurX · ArchitectCO · 2026
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.PAT_FOR_PUBLIC_REPO }}