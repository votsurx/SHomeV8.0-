name: Build & Publish Release to Public Repo

on:
  push:
    tags:
      - 'v*' # Запускать при пуше тега, например v8.0.0

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно для создания релиза в публичном репо

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # Сборка APK с обфускацией и разделением по архитектурам
      - name: Build APK (split-per-abi)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      # Создание релиза в ОТКРЫТОМ репозитории
      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: votsurx/SHome-Releases # ← Укажи владельца и имя ПУБЛИЧНОГО репозитория
          tag_name: ${{ github.ref_name }} # Использует тег, который ты запушил
          name: Release ${{ github.ref_name }}
          body: |
            ## SHome ${{ github.ref_name }}
            
            Автоматическая сборка из закрытого репозитория.
            
            ### Что нового:
            - (Здесь можно описать изменения)
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.PAT_FOR_PUBLIC_REPO }}
